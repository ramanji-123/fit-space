<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="knitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CA684A"/>
      <stop offset="100%" stop-color="#A44E33"/>
    </linearGradient>
    <filter id="dressShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#401B11" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="480" rx="16" fill="#FDFBF7"/>
  <rect x="20" y="20" width="360" height="440" rx="12" fill="#FAF6EE" stroke="#EAE2D5" stroke-width="1.5"/>

  <!-- Column Dress Silhouette -->
  <g transform="translate(100, 45)" filter="url(#dressShadow)">
    <!-- Column Silhouette with Subtle Waist Curve and Straight Midi Drop -->
    <path d="M 50 30 Q 100 45 150 30 L 165 85 L 140 85 L 145 160 Q 135 220 148 350 L 52 350 Q 65 220 55 160 L 60 85 L 35 85 Z"
          fill="url(#knitBg)" stroke="#883A22" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Subtle Rib Texture Lines -->
    <line x1="72" y1="40" x2="72" y2="348" stroke="#D8785B" stroke-width="1" stroke-dasharray="4 2"/>
    <line x1="86" y1="42" x2="86" y2="348" stroke="#D8785B" stroke-width="1" stroke-dasharray="4 2"/>
    <line x1="100" y1="43" x2="100" y2="348" stroke="#D8785B" stroke-width="1.2" stroke-dasharray="4 2"/>
    <line x1="114" y1="42" x2="114" y2="348" stroke="#D8785B" stroke-width="1" stroke-dasharray="4 2"/>
    <line x1="128" y1="40" x2="128" y2="348" stroke="#D8785B" stroke-width="1" stroke-dasharray="4 2"/>

    <!-- Boat Neckline Trim -->
    <path d="M 50 30 Q 100 45 150 30" fill="none" stroke="#7A301A" stroke-width="2.5"/>

    <!-- Side Hem Slit Accent -->
    <line x1="148" y1="310" x2="148" y2="350" stroke="#7A301A" stroke-width="2.5"/>
  </g>

  <!-- Label Badge -->
  <rect x="40" y="405" width="320" height="34" rx="6" fill="#FFFFFF" stroke="#E2D9CB" stroke-width="1"/>
  <text x="55" y="427" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#2D2823" letter-spacing="0.5">COLUMN RIBBED KNIT DRESS</text>
  <text x="345" y="427" text-anchor="end" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#8C7E6F">TERRACOTTA</text>
</svg>
