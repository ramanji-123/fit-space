<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="blazerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#444240"/>
      <stop offset="100%" stop-color="#2D2B29"/>
    </linearGradient>
    <filter id="blazerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1A1816" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="480" rx="16" fill="#FDFBF7"/>
  <rect x="20" y="20" width="360" height="440" rx="12" fill="#FAF6EE" stroke="#EAE2D5" stroke-width="1.5"/>

  <!-- Blazer Silhouette -->
  <g transform="translate(55, 45)" filter="url(#blazerShadow)">
    <!-- Main Body & Structured Shoulders -->
    <path d="M 50 35 L 85 28 L 145 32 L 205 28 L 240 35 L 285 95 L 265 240 L 230 230 L 235 340 L 55 340 L 60 230 L 25 240 L 5 95 Z"
          fill="url(#blazerBg)" stroke="#1F1D1C" stroke-width="2"/>

    <!-- Tailored Lapel Left (Peak) -->
    <path d="M 85 28 L 115 130 L 90 145 L 145 220 L 145 35 Z" fill="#383634" stroke="#1F1D1C" stroke-width="1.5"/>

    <!-- Tailored Lapel Right (Peak) -->
    <path d="M 205 28 L 175 130 L 200 145 L 145 220 L 145 35 Z" fill="#4B4845" stroke="#1F1D1C" stroke-width="1.5"/>

    <!-- Double Welt Pockets -->
    <rect x="68" y="250" width="48" height="10" rx="2" fill="#262423" stroke="#575350" stroke-width="1"/>
    <rect x="174" y="250" width="48" height="10" rx="2" fill="#262423" stroke="#575350" stroke-width="1"/>

    <!-- Chest Pocket -->
    <line x1="80" y1="170" x2="115" y2="165" stroke="#5E5A56" stroke-width="2.5"/>

    <!-- Horn Buttons -->
    <circle cx="150" cy="235" r="4.5" fill="#8C7355" stroke="#423423" stroke-width="1.5"/>
    <circle cx="150" cy="275" r="4.5" fill="#8C7355" stroke="#423423" stroke-width="1.5"/>

    <!-- Subtle Wool Texture / Seam Stitching -->
    <line x1="145" y1="220" x2="145" y2="340" stroke="#22201F" stroke-width="2"/>
    <line x1="95" y1="28" x2="80" y2="340" stroke="#3D3B39" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="195" y1="28" x2="210" y2="340" stroke="#3D3B39" stroke-width="1" stroke-dasharray="3 3"/>
  </g>

  <!-- Label Badge -->
  <rect x="40" y="405" width="320" height="34" rx="6" fill="#FFFFFF" stroke="#E2D9CB" stroke-width="1"/>
  <text x="55" y="427" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#2D2823" letter-spacing="0.5">OVERSIZED VIRGIN WOOL BLAZER</text>
  <text x="345" y="427" text-anchor="end" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#8C7E6F">CHARCOAL</text>
</svg>
