<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="silkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2ECE1"/>
      <stop offset="100%" stop-color="#E2D6C3"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#3A3025" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="480" rx="16" fill="#FDFBF7"/>
  <rect x="20" y="20" width="360" height="440" rx="12" fill="#FAF6EE" stroke="#EAE2D5" stroke-width="1.5"/>

  <!-- Shirt Silhouette -->
  <g transform="translate(60, 50)" filter="url(#softShadow)">
    <!-- Main Body & Sleeves -->
    <path d="M 60 40 L 95 38 L 140 40 L 140 25 L 180 40 L 220 40 L 270 95 L 240 145 L 205 125 L 205 310 Q 140 325 75 310 L 75 125 L 40 145 L 10 95 Z"
          fill="url(#silkBg)" stroke="#C7BBAA" stroke-width="2" stroke-linejoin="round"/>
    <!-- Collar Left -->
    <path d="M 95 38 L 140 78 L 105 105 L 85 40 Z" fill="#E8DFD0" stroke="#B8AB98" stroke-width="1.5"/>
    <!-- Collar Right -->
    <path d="M 185 38 L 140 78 L 175 105 L 195 40 Z" fill="#DED4C4" stroke="#B8AB98" stroke-width="1.5"/>
    <!-- Placket Center -->
    <line x1="140" y1="78" x2="140" y2="315" stroke="#C2B5A2" stroke-width="2.5" stroke-dasharray="6 2"/>
    <!-- Chest Pocket -->
    <rect x="90" y="130" width="38" height="42" rx="4" fill="#EBE4D6" stroke="#C4B8A6" stroke-width="1.2"/>
    <path d="M 90 130 L 128 130" stroke="#BAAD99" stroke-width="2"/>
    <!-- Tortoise Buttons -->
    <circle cx="140" cy="110" r="3.5" fill="#5A432F"/>
    <circle cx="140" cy="155" r="3.5" fill="#5A432F"/>
    <circle cx="140" cy="200" r="3.5" fill="#5A432F"/>
    <circle cx="140" cy="245" r="3.5" fill="#5A432F"/>
    <circle cx="140" cy="290" r="3.5" fill="#5A432F"/>
    <!-- Drape Fold Lines -->
    <path d="M 115 190 Q 125 250 110 305" fill="none" stroke="#D1C5B3" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 165 195 Q 155 255 170 305" fill="none" stroke="#D1C5B3" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Label Badge -->
  <rect x="40" y="405" width="320" height="34" rx="6" fill="#FFFFFF" stroke="#E2D9CB" stroke-width="1"/>
  <text x="55" y="427" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#2D2823" letter-spacing="0.5">SILK CAMP COLLAR SHIRT</text>
  <text x="345" y="427" text-anchor="end" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#8C7E6F">WARM SAND</text>
</svg>
