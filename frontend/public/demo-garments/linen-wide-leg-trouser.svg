<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="linenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#EBE3D7"/>
    </linearGradient>
    <filter id="trouserShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3A3025" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="480" rx="16" fill="#FDFBF7"/>
  <rect x="20" y="20" width="360" height="440" rx="12" fill="#FAF6EE" stroke="#EAE2D5" stroke-width="1.5"/>

  <!-- Trousers Silhouette -->
  <g transform="translate(85, 45)" filter="url(#trouserShadow)">
    <!-- High Waistband -->
    <rect x="25" y="15" width="180" height="22" rx="3" fill="#E8DECة" stroke="#B8AB98" stroke-width="1.5"/>
    <line x1="115" y1="15" x2="115" y2="37" stroke="#A89A86" stroke-width="2"/>
    <circle cx="100" cy="26" r="3" fill="#6B5947"/>

    <!-- Left Leg Flowing Wide -->
    <path d="M 25 37 L 15 340 L 98 340 L 115 130 L 115 37 Z"
          fill="url(#linenBg)" stroke="#C8BCAB" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Right Leg Flowing Wide -->
    <path d="M 205 37 L 215 340 L 132 340 L 115 130 L 115 37 Z"
          fill="url(#linenBg)" stroke="#C8BCAB" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Front Pressed Crease Left -->
    <line x1="56" y1="50" x2="56" y2="340" stroke="#DDD2C2" stroke-width="2" stroke-linecap="round"/>

    <!-- Front Pressed Crease Right -->
    <line x1="174" y1="50" x2="174" y2="340" stroke="#DDD2C2" stroke-width="2" stroke-linecap="round"/>

    <!-- Waist Pleats -->
    <line x1="68" y1="37" x2="63" y2="95" stroke="#C2B4A0" stroke-width="1.5"/>
    <line x1="162" y1="37" x2="167" y2="95" stroke="#C2B4A0" stroke-width="1.5"/>

    <!-- Slash Pockets -->
    <line x1="25" y1="55" x2="42" y2="105" stroke="#B8A892" stroke-width="1.5"/>
    <line x1="205" y1="55" x2="188" y2="105" stroke="#B8A892" stroke-width="1.5"/>
  </g>

  <!-- Label Badge -->
  <rect x="40" y="405" width="320" height="34" rx="6" fill="#FFFFFF" stroke="#E2D9CB" stroke-width="1"/>
  <text x="55" y="427" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#2D2823" letter-spacing="0.5">PLEATED WIDE-LEG TROUSER</text>
  <text x="345" y="427" text-anchor="end" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#8C7E6F">IVORY LINEN</text>
</svg>
