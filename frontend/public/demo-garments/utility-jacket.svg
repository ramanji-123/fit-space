<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="utilityBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6E7665"/>
      <stop offset="100%" stop-color="#555D4D"/>
    </linearGradient>
    <filter id="utilityShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#22261E" flood-opacity="0.12"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="400" height="480" rx="16" fill="#FDFBF7"/>
  <rect x="20" y="20" width="360" height="440" rx="12" fill="#FAF6EE" stroke="#EAE2D5" stroke-width="1.5"/>

  <!-- Utility Jacket Silhouette -->
  <g transform="translate(60, 48)" filter="url(#utilityShadow)">
    <!-- Stand Collar -->
    <path d="M 100 25 L 180 25 L 175 45 L 105 45 Z" fill="#525A4B" stroke="#373D31" stroke-width="1.5"/>

    <!-- Main Jacket Shell -->
    <path d="M 65 42 L 105 45 L 175 45 L 215 42 L 265 95 L 235 240 L 205 230 L 208 330 L 72 330 L 75 230 L 45 240 L 15 95 Z"
          fill="url(#utilityBg)" stroke="#373D31" stroke-width="2" stroke-linejoin="round"/>

    <!-- Storm Placket Cover with Brass Snaps -->
    <rect x="133" y="45" width="14" height="285" fill="#5F6757" stroke="#3D4436" stroke-width="1.5"/>
    <circle cx="140" cy="70" r="3.5" fill="#C29F5C" stroke="#7A6234" stroke-width="1"/>
    <circle cx="140" cy="125" r="3.5" fill="#C29F5C" stroke="#7A6234" stroke-width="1"/>
    <circle cx="140" cy="180" r="3.5" fill="#C29F5C" stroke="#7A6234" stroke-width="1"/>
    <circle cx="140" cy="235" r="3.5" fill="#C29F5C" stroke="#7A6234" stroke-width="1"/>
    <circle cx="140" cy="290" r="3.5" fill="#C29F5C" stroke="#7A6234" stroke-width="1"/>

    <!-- Dual Cargo Flap Chest Pockets -->
    <rect x="85" y="95" width="38" height="42" rx="3" fill="#656D5C" stroke="#41483A" stroke-width="1.2"/>
    <path d="M 83 95 L 125 95 L 125 106 L 104 114 L 83 106 Z" fill="#525A4B" stroke="#353B2F" stroke-width="1.2"/>

    <rect x="157" y="95" width="38" height="42" rx="3" fill="#656D5C" stroke="#41483A" stroke-width="1.2"/>
    <path d="M 155 95 L 197 95 L 197 106 L 176 114 L 155 106 Z" fill="#525A4B" stroke="#353B2F" stroke-width="1.2"/>

    <!-- Hip Bellows Pockets -->
    <rect x="80" y="220" width="45" height="50" rx="3" fill="#656D5C" stroke="#41483A" stroke-width="1.2"/>
    <path d="M 78 220 L 127 220 L 127 232 L 102.5 240 L 78 232 Z" fill="#525A4B" stroke="#353B2F" stroke-width="1.2"/>

    <rect x="155" y="220" width="45" height="50" rx="3" fill="#656D5C" stroke="#41483A" stroke-width="1.2"/>
    <path d="M 153 220 L 202 220 L 202 232 L 177.5 240 L 153 232 Z" fill="#525A4B" stroke="#353B2F" stroke-width="1.2"/>
  </g>

  <!-- Label Badge -->
  <rect x="40" y="405" width="320" height="34" rx="6" fill="#FFFFFF" stroke="#E2D9CB" stroke-width="1"/>
  <text x="55" y="427" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#2D2823" letter-spacing="0.5">STRUCTURED UTILITY FIELD JACKET</text>
  <text x="345" y="427" text-anchor="end" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#8C7E6F">OLIVE SAGE</text>
</svg>
